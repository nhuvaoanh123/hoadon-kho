name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build HoaDonKho.exe
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VER="dev-${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VER" -o dist/HoaDonKho.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: HoaDonKho-windows
          path: dist/HoaDonKho.exe

  # The shipped exe on fresh Windows machines without Go or any project tooling.
  smoke:
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HoaDonKho-windows
          path: dist
      - name: Run the exe like a user
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1 -Exe dist/HoaDonKho.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HoaDonKho-windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/HoaDonKho.exe --clobber -R "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" dist/HoaDonKho.exe -R "$GITHUB_REPOSITORY" --title "HoaDonKho $GITHUB_REF_NAME" --generate-notes
